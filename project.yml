name: QuietNest
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.zxf.quietnest
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
targets:
  QuietNest:
    type: application
    platform: iOS
    sources:
      - QuietNest/App
      - QuietNest/Views
      - QuietNest/Audio
      - QuietNest/Models
      - QuietNest/Services
      - path: QuietNest/Resources/Assets
        type: folder
      - QuietNest/Resources/AppIcon.xcassets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        UIBackgroundModes: [audio]
  QuietNestTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - QuietNestTests
    dependencies:
      - target: QuietNest
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zxf.quietnest.tests
schemes:
  QuietNest:
    build:
      targets:
        QuietNest: all
        QuietNestTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: QuietNestTests
