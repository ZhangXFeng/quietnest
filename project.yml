name: QuietNest
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.zxf.quietnest
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
targets:
  QuietNest:
    type: application
    platform: iOS
    sources:
      - QuietNest/App
      - QuietNest/Views
      - QuietNest/Audio
      - QuietNest/Models
      - QuietNest/Services
      - path: QuietNest/Resources/Assets
        type: folder
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        UIBackgroundModes: [audio]
schemes:
  QuietNest:
    build:
      targets:
        QuietNest: all
    run:
      config: Debug
